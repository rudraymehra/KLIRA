name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: ci
    if: contains(github.ref, '-rc') || contains(github.ref, '-beta')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/klira-server:${{ github.ref_name }}
            ${{ vars.REGISTRY_URL }}/klira-server:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to staging server
        run: |
          echo "TODO: Add your staging deployment commands here."
          echo "Examples:"
          echo "  - SSH and docker pull + restart"
          echo "  - kubectl set image deployment/klira-server ..."
          echo "  - aws ecs update-service ..."

      - name: Post-deploy health check
        run: |
          echo "TODO: Add staging health check URL"
          # Example: curl -f https://staging.klira.xyz/v1/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    if: "!contains(github.ref, '-rc') && !contains(github.ref, '-beta')"
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/klira-server:${{ github.ref_name }}
            ${{ vars.REGISTRY_URL }}/klira-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production server
        run: |
          echo "TODO: Add your production deployment commands here."
          echo "Examples:"
          echo "  - SSH and docker pull + restart"
          echo "  - kubectl set image deployment/klira-server ..."
          echo "  - aws ecs update-service ..."

      - name: Post-deploy health check
        run: |
          echo "TODO: Add production health check URL"
          # Example: curl -f https://klira.xyz/v1/health || exit 1
