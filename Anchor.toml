[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
klira = "KLRa8WndxF7bQpYm3V96TjHv2Zke5BscNh4GoCuRf1A"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
test-ata = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/klira/ata.test.ts"
test-cancel = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/klira/cancel.test.ts"
test-close = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/klira/close.test.ts"
test-expire = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/klira/expire.test.ts"
test-fill = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/klira/fill.test.ts"
test-init = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/klira/init.test.ts"
test-partial = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/klira/partial-fill.test.ts"
test-update = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/klira/update.test.ts"
